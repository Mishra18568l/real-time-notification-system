<!doctype html><html><head><meta charset="utf-8"><title>Notification Demo</title><style>body{font:16px system-ui;max-width:680px;margin:50px auto;background:#f5f7fb;color:#152238}button,input{padding:10px;margin:5px}li{padding:12px;background:white;margin:8px;border-radius:8px}</style></head><body><h1>Live Notifications</h1><p>Local development demo. No authentication is configured.</p><label>User ID <input id="user" value="alice"></label><button onclick="connect()">Connect</button><span id="status">Disconnected</span><hr><input id="message" value="Your order is ready"><button onclick="send()">Send notification</button><button onclick="load()">Load history</button><ul id="list"></ul><script>let ws;function user(){return document.getElementById('user').value}function add(n){let li=document.createElement('li');li.textContent=n.type+': '+n.message;document.getElementById('list').prepend(li)}function connect(){if(ws)ws.close();ws=new WebSocket(`ws://${location.host}/ws?userId=${encodeURIComponent(user())}`);ws.onopen=()=>status.textContent='Connected';ws.onclose=()=>status.textContent='Disconnected';ws.onmessage=e=>add(JSON.parse(e.data))}async function send(){await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:crypto.randomUUID(),userId:user(),type:'ORDER_UPDATE',message:document.getElementById('message').value,attempt:0})})}async function load(){let r=await fetch('/api/users/'+encodeURIComponent(user())+'/notifications');(await r.json()).reverse().forEach(add)}</script></body></html>
